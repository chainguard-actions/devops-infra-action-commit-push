name: Test commit with file changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a file change to commit
        run: |
          echo "test-change-$(date +%s)" > "$GITHUB_WORKSPACE/test-artifact.txt"
          git add "$GITHUB_WORKSPACE/test-artifact.txt"

      - name: Set up a git origin reachable inside the Docker container
        run: |
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "test: commit with file changes"
          commit_prefix: "[CI]"
        continue-on-error: true

      - name: Assert files_changed output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FILES: ${{ steps.action.outputs.files_changed }}
          BRANCH: ${{ steps.action.outputs.branch_name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "files_changed: $FILES"
          echo "branch_name: $BRANCH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$FILES" ]; then
              echo "FAIL: action succeeded but files_changed output is empty"
              exit 1
            fi
            echo "PASS: files_changed='$FILES', branch='$BRANCH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or token limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
