name: Test basic commit-push (allow_empty_commit)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git identity
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Create a test file to commit
        run: |
          echo "test content $(date)" > test-commit-file.txt
          git add test-commit-file.txt

      - id: action
        uses: .
        with:
          github_token: fake-token-for-act-test
          commit_message: "test: basic commit"
          allow_empty_commit: "false"
          target_branch: act-test-branch
        continue-on-error: true

      - name: Assert branch_name output is set
        env:
          BRANCH: ${{ steps.action.outputs.branch_name }}
        run: |
          echo "branch_name: $BRANCH"
          if [ -z "$BRANCH" ]; then
            echo "WARN: branch_name output is empty (may be expected if push failed due to fake token)"
          else
            echo "PASS: branch_name=$BRANCH"
          fi

      - name: Assert action ran (step completed)
        run: |
          echo "Action step completed (with continue-on-error)"
          echo "PASS"
