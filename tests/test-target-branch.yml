name: Test push to target branch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a file change to commit
        run: |
          echo "target-branch-test-$(date +%s)" > "$GITHUB_WORKSPACE/test-target-branch.txt"
          git add "$GITHUB_WORKSPACE/test-target-branch.txt"

      - name: Set up a git origin reachable inside the Docker container
        run: |
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "test: push to target branch"
          target_branch: "ci-test-target-branch"
        continue-on-error: true

      - name: Assert branch_name output matches target
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BRANCH: ${{ steps.action.outputs.branch_name }}
          FILES: ${{ steps.action.outputs.files_changed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "branch_name: $BRANCH"
          echo "files_changed: $FILES"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BRANCH" ]; then
              echo "FAIL: action succeeded but branch_name output is empty"
              exit 1
            fi
            if [ "$BRANCH" != "ci-test-target-branch" ]; then
              echo "FAIL: expected branch_name='ci-test-target-branch', got '$BRANCH'"
              exit 1
            fi
            echo "PASS: branch_name='$BRANCH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or token limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
